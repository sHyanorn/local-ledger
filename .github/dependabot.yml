version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Node types follow the Node major that Electron embeds (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
