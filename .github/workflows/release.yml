name: release
on:
  # A version tag builds a draft release; publishing it is done by hand.
  push:
    tags: ['v*']
  # A dry run: the same builds and checksums, kept as workflow artifacts.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The same checks as CI, so a tag on a commit that fails them builds nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
          - os: macos-15-intel
            name: mac-x64
          - os: windows-2025
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The tag names the package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: npm ci
      - uses: ./.github/actions/install-electron
      - name: Self-test of the unpackaged app
        run: npm run test:native
      - name: Installers
        run: npm run build
      - name: Checks of the packaged app
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.dmg
            release/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Attestations go to a public log, so only a real release makes one.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - if: github.event_name == 'push'
        name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned builds; see the README for first launch on macOS and Windows. Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist
          retention-days: 7
